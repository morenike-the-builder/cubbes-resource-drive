<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Review - Cubbes Resource Drive</title>
  <meta name="description" content="Review and approve submissions." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" style="text-decoration:none; display:flex; align-items:center; gap:8px;">
        <img src="https://cubbes.app/assets/logo.svg" alt="Cubbes" class="brand-logo" />
        <span class="brand-sep">|</span>
        <span class="brand-sub">Resource Drive</span>
      </a>
      <nav class="header-nav">
        <a href="/">Upload</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/admin">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <div id="content">
      <p class="muted">Loading…</p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    function adminGateTemplate(errorMessage) {
      return `
        <div class="gate-wrapper">
          <div class="card gate-card" style="max-width:480px;">
            <h2>Admin Access</h2>
            <p class="muted lede">Enter your admin PIN to access the review dashboard.</p>
            <form id="adminGateForm">
              <div class="field">
                <label for="adminPin">Admin PIN</label>
                <input id="adminPin" name="adminPin" type="password" placeholder="••••" required />
              </div>
              <button class="btn" type="submit" id="adminGateBtn">Access Dashboard</button>
            </form>
            ${errorMessage ? `<p class="muted" style="color:#b91c1c; margin-top:12px;">${escapeHtml(errorMessage)}</p>` : ""}
          </div>
        </div>
      `;
    }

    function reviewQueueTemplate(submissions, allCourses) {
      const stats = {
        total: submissions.length,
        approved: submissions.filter(s => s.status === "APPROVED").length,
        rejected: submissions.filter(s => s.status === "REJECTED").length,
        pending: submissions.filter(s => s.status === "PENDING").length,
      };

      const tableHTML = submissions.length
        ? `
          <div class="submissions-table">
            <div class="table-header">
              <div class="col-contributor">Contributor</div>
              <div class="col-course">Course</div>
              <div class="col-type">Type</div>
              <div class="col-submitted">Submitted</div>
              <div class="col-status">Status</div>
              <div class="col-action">Action</div>
            </div>
            ${submissions.map((sub, idx) => {
              const statusClass = sub.status.toLowerCase();
              return `
                <div class="table-row" data-index="${idx}">
                  <div class="col-contributor">${escapeHtml(sub.uploadedBy)}</div>
                  <div class="col-course">${escapeHtml(sub.courseCode)} - ${escapeHtml(sub.courseTitle)}</div>
                  <div class="col-type">${sub.type}</div>
                  <div class="col-submitted">${new Date(sub.createdAt).toLocaleDateString()}</div>
                  <div class="col-status"><span class="status-badge status-${statusClass}">${sub.status}</span></div>
                  <div class="col-action">
                    <button class="btn-small review-btn" data-index="${idx}">Review</button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `
        : `<p class="muted" style="text-align:center; padding:40px;">No submissions yet.</p>`;

      return `
        <div class="hero-banner">
          <div class="hero-content">
            <h1>Submissions Dashboard</h1>
            <p>Review and approve course materials</p>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-number">${stats.total}</div>
            <div class="stat-label">Total Submissions</div>
          </div>
          <div class="stat-card stat-pending">
            <div class="stat-number">${stats.pending}</div>
            <div class="stat-label">Pending Review</div>
          </div>
          <div class="stat-card stat-approved">
            <div class="stat-number">${stats.approved}</div>
            <div class="stat-label">Approved</div>
          </div>
          <div class="stat-card stat-rejected">
            <div class="stat-number">${stats.rejected}</div>
            <div class="stat-label">Rejected</div>
          </div>
        </div>

        ${tableHTML}

        <div id="reviewModal" class="modal" style="display:none;">
          <div class="modal-overlay"></div>
          <div class="modal-content">
            <button class="modal-close" id="closeReviewBtn">✕</button>

            <div class="modal-body">
              <div class="review-container-modal">
                <div class="review-left-modal">
                  <h3 style="margin-top:0;">File Preview</h3>
                  <div id="fileViewer" class="file-viewer"></div>
                </div>

                <div class="review-right-modal">
                  <h3 style="margin-top:0;">Submission Details</h3>
                  <dl class="detail-list">
                    <dt>Contributor</dt>
                    <dd id="detail-contributor"></dd>

                    <dt>University</dt>
                    <dd id="detail-university"></dd>

                    <dt>Department</dt>
                    <dd id="detail-department"></dd>

                    <dt>Course</dt>
                    <dd id="detail-course"></dd>

                    <dt>Resource Type</dt>
                    <dd id="detail-type"></dd>

                    <dt>File</dt>
                    <dd id="detail-file" class="muted"></dd>

                    <dt>Submitted</dt>
                    <dd id="detail-submitted" class="muted"></dd>
                  </dl>

                  <h4 style="margin-top:20px;">Re-assign Course (if incorrect)</h4>
                  <div class="form-group">
                    <input type="text" id="courseReassign" placeholder="Search course to reassign..." />
                    <div id="reassignDropdown" class="course-dropdown" style="display:none;"></div>
                  </div>

                  <h4 style="margin-top:20px;">Actions</h4>
                  <div class="action-buttons">
                    <button class="btn btn-success" id="approveBtn">✓ Approve & Release Credit</button>
                    <button class="btn btn-outline" id="rejectBtn">✗ Reject</button>
                    <button class="btn btn-danger" id="flagBtn">🚩 Flag Account</button>
                  </div>

                  <div id="rejectForm" style="display:none; margin-top:20px; padding:20px; background:var(--red-bg); border-radius:8px;">
                    <label style="display:block; margin-bottom:12px;">
                      <strong style="color:var(--red-ink);">Rejection Reason</strong>
                    </label>
                    <select id="rejectionReason" style="width:100%; margin-bottom:12px;">
                      <option value="">Select a reason...</option>
                      <option value="DUPLICATE">Duplicate File</option>
                      <option value="UNREADABLE">Unreadable / Poor Quality</option>
                      <option value="INCORRECT">Incorrect / Non-Academic File</option>
                      <option value="INCOMPLETE">Incomplete Document</option>
                    </select>
                    <div style="display:flex; gap:12px;">
                      <button class="btn btn-outline" id="confirmRejectBtn">Confirm Reject</button>
                      <button class="btn btn-outline" id="cancelRejectBtn">Cancel</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function showAdminGate(errorMessage) {
      const content = document.getElementById("content");
      content.innerHTML = adminGateTemplate(errorMessage);

      document.getElementById("adminGateForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pin = document.getElementById("adminPin").value.trim();
        const btn = document.getElementById("adminGateBtn");

        btn.disabled = true;
        btn.textContent = "Checking…";

        try {
          const result = await verifyAdminPin(pin);
          if (!result.authorized) {
            showAdminGate("Invalid PIN. Try again.");
            return;
          }
          localStorage.setItem("admin_pin", pin);
          showReviewQueue();
        } catch (err) {
          showAdminGate("Error: " + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Access Dashboard";
        }
      });
    }

    async function showReviewQueue() {
      const content = document.getElementById("content");
      const result = await getPendingSubmissions();
      const allCourses = await getAllCourses();

      function renderQueue() {
        content.innerHTML = reviewQueueTemplate(result.submissions, allCourses.courses || []);

        // Table row click handlers
        document.querySelectorAll(".review-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = parseInt(btn.getAttribute("data-index"));
            openReviewModal(result.submissions[idx]);
          });
        });
      }

      function openReviewModal(submission) {
        const modal = document.getElementById("reviewModal");
        modal.style.display = "flex";

        // Populate details
        document.getElementById("detail-contributor").textContent = escapeHtml(submission.uploadedBy);
        document.getElementById("detail-university").textContent = escapeHtml(submission.university);
        document.getElementById("detail-department").textContent = escapeHtml(submission.department);
        document.getElementById("detail-course").textContent = `${escapeHtml(submission.courseCode)} - ${escapeHtml(submission.courseTitle)}`;
        document.getElementById("detail-type").textContent = submission.type;
        document.getElementById("detail-file").textContent = escapeHtml(submission.fileName);
        document.getElementById("detail-submitted").textContent = new Date(submission.createdAt).toLocaleDateString();

        // File viewer
        const fileViewer = document.getElementById("fileViewer");
        if (submission.fileUrl) {
          fileViewer.innerHTML = `<iframe src="${submission.fileUrl}#toolbar=0" style="width:100%; height:100%; border:none;"></iframe>`;
        } else {
          fileViewer.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted);">File not available</div>`;
        }

        // Course reassignment
        const courseReassign = document.getElementById("courseReassign");
        const reassignDropdown = document.getElementById("reassignDropdown");
        courseReassign.value = "";

        courseReassign.addEventListener("input", debounce(() => {
          if (courseReassign.value.length < 2) {
            reassignDropdown.style.display = "none";
            return;
          }
          const filtered = (allCourses.courses || []).filter(c =>
            `${c.code} - ${c.title}`.toLowerCase().includes(courseReassign.value.toLowerCase())
          );
          if (filtered.length > 0) {
            reassignDropdown.innerHTML = filtered.slice(0, 5).map(c => `
              <div class="course-option" data-id="${c.id}">
                ${escapeHtml(c.code)} - ${escapeHtml(c.title)}
              </div>
            `).join("");
            reassignDropdown.style.display = "block";

            document.querySelectorAll(".course-option").forEach(opt => {
              opt.addEventListener("click", () => {
                courseReassign.value = opt.textContent;
                submission.courseId = opt.getAttribute("data-id");
                reassignDropdown.style.display = "none";
              });
            });
          }
        }, 300));

        // Action buttons
        const approveBtn = document.getElementById("approveBtn");
        const rejectBtn = document.getElementById("rejectBtn");
        const flagBtn = document.getElementById("flagBtn");
        const rejectForm = document.getElementById("rejectForm");

        approveBtn.onclick = async () => {
          if (confirm("Approve this submission and release credit?")) {
            try {
              await approveSubmission(submission.id, submission.courseId);
              showToast("Submission approved.", false);
              modal.style.display = "none";
              renderQueue();
            } catch (err) {
              showToast("Error: " + err.message, true);
            }
          }
        };

        rejectBtn.onclick = () => {
          rejectForm.style.display = "block";
        };

        document.getElementById("cancelRejectBtn").onclick = () => {
          rejectForm.style.display = "none";
        };

        document.getElementById("confirmRejectBtn").onclick = async () => {
          const reason = document.getElementById("rejectionReason").value;
          if (!reason) {
            showToast("Please select a reason.", true);
            return;
          }
          try {
            await rejectSubmission(submission.id, reason);
            showToast("Submission rejected.", false);
            modal.style.display = "none";
            renderQueue();
          } catch (err) {
            showToast("Error: " + err.message, true);
          }
        };

        flagBtn.onclick = async () => {
          if (confirm("Flag this account for abuse?")) {
            try {
              await flagAccount(submission.uploadedBy);
              showToast("Account flagged.", false);
              modal.style.display = "none";
              renderQueue();
            } catch (err) {
              showToast("Error: " + err.message, true);
            }
          }
        };

        document.getElementById("closeReviewBtn").onclick = () => {
          modal.style.display = "none";
        };

        document.querySelector(".modal-overlay").onclick = () => {
          modal.style.display = "none";
        };
      }

      renderQueue();
    }

    async function render() {
      const content = document.getElementById("content");
      if (configIsMissing()) {
        content.innerHTML = `<p class="muted">Set <code>APPS_SCRIPT_URL</code> in config.js to connect.</p>`;
        return;
      }

      const storedPin = localStorage.getItem("admin_pin");
      if (!storedPin) {
        showAdminGate();
        return;
      }

      try {
        const result = await verifyAdminPin(storedPin);
        if (!result.authorized) {
          localStorage.removeItem("admin_pin");
          showAdminGate();
          return;
        }
        showReviewQueue();
      } catch (err) {
        showAdminGate();
      }
    }

    render();
  </script>
</body>
</html>
